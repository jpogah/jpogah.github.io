<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10110f" />
    <title>Daily Nigeria News — Support</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: #f4f1e9; background: #10110f; font-family: "Avenir Next", sans-serif; }
      main { width: min(42rem, calc(100% - 2.5rem)); padding: 4rem 0; }
      .label { color: #84d5a2; font-size: .68rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
      h1 { margin: 1rem 0 0; font-family: Georgia, serif; font-size: clamp(3.5rem, 12vw, 7rem); font-weight: 400; letter-spacing: -.06em; line-height: .9; }
      p:not(.label) { max-width: 31rem; margin: 2rem 0; color: rgba(244,241,233,.65); font-family: Georgia, serif; font-size: 1.1rem; line-height: 1.55; }
      a { display: inline-block; margin-right: 1rem; padding: .75rem 1rem; border: 1px solid currentColor; color: #f4f1e9; font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-decoration: none; text-transform: uppercase; }
      a:first-of-type { color: #10110f; background: #84d5a2; border-color: #84d5a2; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Application support</p>
      <h1>Daily Nigeria News</h1>
      <p>Please contact us if you have a question or need help with the Daily Nigeria News app.</p>
      <a href="mailto:jpogah@gmail.com">Email support</a>
      <a href="../../">Return home</a>
    </main>
  </body>
</html>
